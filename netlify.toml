[build]
  command = "bash scripts/with-dart-sass.sh env SITE_ENV=production SITE_PROFILE=client SITE_URL=\"$URL\" INTAKE_BACKEND=netlify node scripts/build-site.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  TZ = "America/Chicago"

[context.deploy-preview]
  command = "bash scripts/with-dart-sass.sh env SITE_ENV=preview SITE_PROFILE=client SITE_URL=\"$DEPLOY_PRIME_URL\" INTAKE_BACKEND=disabled node scripts/build-site.mjs"

[context.deploy-preview.environment]
  HUGO_ENV = "staging"

[context.branch-deploy]
  command = "bash scripts/with-dart-sass.sh env SITE_ENV=preview SITE_PROFILE=client SITE_URL=\"$DEPLOY_PRIME_URL\" INTAKE_BACKEND=disabled node scripts/build-site.mjs"

[context.branch-deploy.environment]
  HUGO_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/consult"
  to = "/consultation/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/consultation/"
  status = 301
