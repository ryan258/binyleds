[build]
  command = "hugo --gc --minify --panicOnWarning --baseURL \"$URL\""
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  TZ = "America/Chicago"

[context.deploy-preview]
  command = "hugo --gc --minify --panicOnWarning --baseURL \"$DEPLOY_PRIME_URL\""

[context.branch-deploy]
  command = "hugo --gc --minify --panicOnWarning --baseURL \"$DEPLOY_PRIME_URL\""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/consult"
  to = "/consultation/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/consultation/"
  status = 301
