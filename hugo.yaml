baseURL: https://example.org/
locale: en-US
title: Binyled’s Storyscape
copyright: Binyled’s Storyscape
enableRobotsTXT: true
timeZone: America/Chicago

# Keeps Hugo from generating empty /tags/ and /categories/ list pages,
# which would otherwise need a list template this site does not have.
taxonomies: {}

outputs:
  home:
    - HTML

markup:
  goldmark:
    renderer:
      unsafe: true

minify:
  disableXML: false
  minifyOutput: true

menus:
  main:
    - name: Adventures
      pageRef: /adventures
      weight: 10
    - name: How it works
      pageRef: /how-it-works
      weight: 20
    - name: Questions
      pageRef: /questions
      weight: 30
    - name: Request a consultation
      pageRef: /consultation
      weight: 40
      params:
        cta: true

params:
  author: Binyled’s Storyscape
  description: >-
    Explore a private tabletop adventure in Bentonville and Northwest Arkansas.
    I prepare and guide the evening so you can play alongside your guests.
  keywords:
    - private tabletop experience
    - game master Bentonville
    - tabletop roleplaying Northwest Arkansas
    - in-home game night
    - private in-home tabletop adventure
  favicon: favicon.ico
  appleIcon: apple-touch-icon.png
  profile: exemplar
  storyscapeArtwork: true
  includeInternalGuides: true
  intakeBackend: disabled
  monogram: BS
  brandPrimary: Binyled’s
  brandSecondary: Storyscape
  tagline: You host the people. I host the world.
  serviceName: The Private Storyscape
  serviceType: Private in-home tabletop roleplaying experience
  serviceAreaHeading: In your home
  serviceAreaText: Bentonville and Northwest Arkansas, with each date and location confirmed privately.
  areaServed: [Bentonville, Northwest Arkansas]
  defaultTheme: system
  images:
    - images/storyscape/social-link.png
  socialImageAlt: "Binyled’s Storyscape. You host the people. I host the world. Private in-home tabletop adventures in Bentonville and Northwest Arkansas, beside a hand-drawn map, a dark die, and a glass of water on a walnut table."
  consultationPath: consultation/

# Hugo copies ignored files unless its static mount excludes them explicitly.
module:
  mounts:
    - source: static
      target: static
      files: ["! temp/**", "! images/temp/**", "! .DS_Store", "! **/.DS_Store", "**"]
