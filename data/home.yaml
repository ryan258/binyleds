      text: The people, the room, and the few details worth having ready before a consultation.
      link: {label: Read the host guide, url: host-guide/}
    - title: What happens before play?
      tag: Understand the process
      text: Follow the path from an initial idea to an agreed scope and a guided evening.
      link: {label: Walk through the process, url: how-it-works/}
    - title: First time at the table?
      tag: Welcome new players
      text: See how guests with different experience levels can share the same adventure.
      link: {label: Find your place at the table, url: for-your-table/}

faq:
  eyebrow: Quick answers
  title: What hosts ask first
  items:
    - question: Do we need to know how to play D&D?
      answer: No. I teach the rules as they come up. If your group already loves D&D or another game, tell me and I’ll plan around it.
    - question: How many people, and for how long?
      answer: Three to six players, you included, for about three hours. That keeps every guest in the story and still reaches a real ending.
    - question: What does it cost?
      answer: It depends on group size, location, and what I prepare. You’ll see the full quote, and everything it covers, before you commit.
    - question: Can the story fit an occasion or theme?
      answer: Yes. Tell me the occasion, the mood, and any ideas your group already has. The story makes room for them without turning into a theme party.
    - question: Does an inquiry reserve a date?
      answer: No. It starts a conversation. Your date is held once you’ve accepted the plan and quote.
  link: {label: Read all the practical answers, url: questions/}

trust:
  eyebrow: Client story layout · Local preview
  title: Let a real experience tell the story
  intro: This layout is reserved for an approved account from a real client. No testimonial or endorsement is being represented here.
  items:
    - title: The gathering
      text: Describe the actual occasion and what the host wanted, using details they have agreed can be shared.
    - title: The experience
      text: Explain the preparation and choices that made a difference, grounded in what actually happened.
    - title: The host’s words
      text: Add the exact approved quotation and agreed attribution when available. Leave this module unpublished until then.

booking:
  eyebrow: Booking handoff · Local preview
  title: A clear next step when you are ready
  intro: A future booking provider can take over after the scope is agreed. No live availability, payment collection, or reservation is connected in this layout.
  items:
    - title: Agree the experience
      text: Confirm the people, place, scope, quote, and terms directly.
    - title: Confirm an available date
      text: A connected provider would show actual availability here after it has been configured and verified.
    - title: Receive confirmation
      text: The booking service would supply the receipt and confirmation. This preview cannot reserve a date.
