hero:
  eyebrow: Private tabletop adventures · Northwest Arkansas
  line_one: You host the people.
  line_two: I host the world.
  lede: >-
    One evening, one story, written for the friends around your table. I bring
    the plot, the rules, and the pacing, so you get to play instead of plan.
  primary_cta:
    label: Request a private consultation
    url: consultation/
  secondary_cta:
    label: See how it works
    url: "#process"
  signature: I build the world. You shape the story.

proof:
  - label: You play, too
    detail: Nobody has to run the game or study a rulebook. That part is mine.
  - label: Beginners belong here
    detail: Every turn starts with one plain question—what do you do? Rules arrive only when they matter.
  - label: Written for this group
    detail: The story starts from who’s coming, what they love, and why they’re gathering.

positioning:
  link: {label: Explore the Private Storyscape, url: experience/}
  eyebrow: The Private Storyscape
  title: Play at your own gathering
  paragraphs:
    - >-
      The Private Storyscape is a guided tabletop roleplaying adventure for one
      evening at your home. You bring the people. I take care of the story,
      the rules, and the pace so you can play alongside them.
    - >-
      Tell me what your friends enjoy and how familiar they are with tabletop
      games. I can open with a gentle mystery for first-time players or give an
      experienced group more room to investigate and improvise.
  pullquote: You invite the guests. The world arrives prepared.

process:
  link: {label: See how the evening works, url: how-it-works/}
  eyebrow: How it works
  title: From first message to final scene
  intro: >-
    Three steps. Nothing is booked until you say yes.
  steps:
    - number: "01"
      glyph: consultation
      title: Tell me about your gathering
      text: >-
        A possible date, your area, and a rough guest count. Add who’s coming
        and how you want the night to feel.
    - number: "02"
      glyph: materials
      title: Get a clear plan and quote
      text: >-
        I reply with availability, what’s included, and the full price. If the
        date or format won’t work, I’ll tell you plainly.
    - number: "03"
      glyph: play
      title: Pull up a chair
      text: >-
        I arrive prepared, set the opening scene, and guide the story while
        your guests decide what happens next.

details:
  eyebrow: What the commission can hold
  title: What I can prepare for your table
  intro: >-
    The story, materials, and practical arrangements depend on your guests and
    your space. I confirm what’s included with you before you commit.
  items:
    - title: Story and characters
      text: A focused adventure, approachable roles, and choices tuned to the group.
    - title: Guest guidance
      text: A calm introduction to the table, the world, and only the rules people need.
    - title: Pacing and facilitation
      text: The evening keeps moving while every guest has room to contribute.
    - title: Atmosphere and materials
      text: Maps, music, miniatures, and selected physical details where they serve the story.
    - title: In-home presence
      text: I arrive prepared for your space and guide the table from the opening scene to the final moment.
    - title: A possible next chapter
      text: When the table wants more, the conversation can continue after the final scene.

reassurance:
  link: {label: See who the experience is for, url: for-your-table/}
  eyebrow: First-time and experienced players
  title: Everyone can start with a choice
  paragraphs:
    - >-
      I describe what your characters see, then ask what they do. Answer in
      character or just say what you’d like to try. Both work.
    - >-
      First-timers pick up the rules as they go. Seasoned players get room to
      scheme and improvise—including the friend who usually runs the game and
      finally gets to play.
  pullquote: Within the first scene, the evening belongs to everyone.

philosophy:
  eyebrow: The approach
  title: Make space for the people at the table
  paragraphs:
    - >-
      I ask what would help your guests feel comfortable. We can talk about
      breaks, how guests prefer to take a turn, and anything the story should
      leave out.
    - >-
      During play, I keep track of the pace and give guests time to ask a
      question, consider a choice, or pass the turn.
  link:
    label: Read the hosting philosophy
    url: about/

location:
  eyebrow: Bentonville, Arkansas
  title: At home in Northwest Arkansas
  text: >-
    The Private Storyscape is designed for homes in Bentonville and Northwest
    Arkansas. Date, location, and travel fit are confirmed during consultation.
  link:
    label: See if the experience fits your table
    url: for-your-table/

closing:
  eyebrow: Ready when you are
  title: Request a private consultation
  text: >-
    A possible date, your area in Northwest Arkansas, and a rough guest count
    are enough. You’ll get availability, a plan, and a full quote. Nothing is
    owed until you say yes.
  cta:
    label: Request a private consultation
    url: consultation/


services:
  eyebrow: Your gathering
  title: Bring the people you want to play with
  intro: Tell me who’s coming. Their interests and experience can help shape the opening scene, pace, and practical details.
  items:
    - title: A private adventure
      tag: One memorable gathering
      text: Gather your friends for a self-contained story, with all the preparation and game mastering taken care of so you can play too.
      link: {label: Explore a private evening, url: experience/}
    - title: Your first table
      tag: New to roleplaying
      text: Give curious guests an approachable way into the game, with space to ask questions and learn through their own choices.
      link: {label: Help new players feel at home, url: for-your-table/}
    - title: A personal occasion
      tag: A reason to gather
      text: Bring a birthday, reunion, or long-awaited night with friends into the conversation. The occasion can shape the story without taking it over.
      link: {label: Plan around your gathering, url: gatherings/}

packages:
  eyebrow: Choose a shape
  title: Three ways to begin
  intro: Most evenings start from one of these. Your quote reflects your group, your location, and what I prepare.
  caption: Compare three kinds of evening
  columns: [A first adventure, A celebration, A continuing story]
  rows:
    - label: Made for
      values: [Curious friends who’ve never played, "A birthday, reunion, or milestone", A table that wants to keep going]
    - label: The story
      values: [Complete in one evening, Complete in one evening with nods to the occasion, An opening chapter built to return to]
    - label: I’ll ask about
      values: [Who’s coming and how new they are, The guest of honor and what to weave in, Everyone’s calendar and a rhythm that lasts]
    - label: Before you book
      values: ["Date, plan, and full quote", "Date, plan, and full quote", "Schedule, plan, and full quote"]
  link: {label: Request a quote for your table, url: consultation/}

adventures:
  eyebrow: A glimpse of the possible
  title: Which story would your table choose?
  intro: Three ways a night might open. Each is a starting point—yours gets written around your guests.
  items:
    - title: The Last Light of Lantern Bay
      number: "01"
      tone: Wonder · Discovery
      premise: Once a year, the lighthouse shines inland. Tonight, it has revealed a path no one remembers building.
      choice: Follow the light, or find out who lit it?
      play: For guests who enjoy exploration and shared discoveries.
    - title: The Midnight Invitation
      number: "02"
      tone: Mystery · Conversation
      premise: Every guest at a secluded manor has received the same invitation. The host insists they never sent it.
      choice: Trust your fellow guests, or keep your own counsel?
      play: For a table drawn to clues, characters, and lively discussion.
    - title: One Very Inconvenient Dragon
      number: "03"
      tone: Wit · Negotiation
      premise: A dragon has claimed the town bridge. It wants neither gold nor a fight. It wants someone to hear its complaint.
      choice: Bargain, investigate, or attempt something unreasonable?
      play: For friends who enjoy improvisation and unexpected solutions.
  link: {label: Start with one of these or your own idea, url: consultation/}

gallery:
  eyebrow: At the table
  title: Around the Storyscape table
  intro: A map, a die, a few well-chosen details. Enough to set the scene without crowding the conversation.
  items:
    - image: images/storyscape/prepared-table-720.webp
      alt: An unrolled cream shoreline map rests beside a brass die, folded linen, and a glass of water on a warmly lit walnut table.
      title: The Prepared Table
      caption: A map gives the group somewhere to start. The guests decide where to go.
    - image: images/storyscape/world-in-the-details-720.webp
      alt: A brass die and pencil rest beside a hand-drawn shoreline on cream paper.
      title: World in the Details
      caption: A shoreline, a path, and just enough detail to invite a first choice.

comfort:
  eyebrow: Before the first scene
  title: A comfortable table starts with a conversation
  intro: Share what would help your group participate. Practical arrangements are confirmed together, and personal details can wait for a private conversation.
  items:
    - title: Choose the tone
      text: Lighthearted discovery, dramatic choices, gentle mystery—tell me what your guests would enjoy and what they would prefer to leave out.
    - title: Make participation easier
      text: We can discuss explanations, breaks, seating, and access needs before agreeing on the evening. You do not need to share a diagnosis.
    - title: Leave room to adjust
      text: Discuss how guests can ask a question, pause, or raise a concern. Comfort belongs in the preparation as much as the story does.

