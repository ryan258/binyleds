  eyebrow: Find your kind of evening
  title: A table for every starting point
  intro: Begin with the people you want to gather. Together, we can work out the right story, pace, and practical fit.
  items:
    - title: A private adventure
      tag: One memorable gathering
      text: Gather your friends for a self-contained story, with the preparation and game mastering taken care of within an agreed scope.
