  adventure:
    eyebrow: Private tabletop adventures
    line_one: One evening.
    line_two: A world of possibility.
    lede: A mysterious invitation. An unlikely alliance. A choice your friends will still be talking about. Begin with the gathering, and let the story grow around it.
    primary_cta: {label: Imagine your evening, url: consultation/}
    secondary_cta: {label: Browse story ideas, url: adventures/}
    signature: The most interesting part of the story is you.
services:
  extended:
    eyebrow: Possible starting points
    title: What would your guests enjoy?
    intro: The Private Storyscape starts with one evening at your table. These formats are starting points for our conversation, and we’ll confirm the right fit and details together.
    items:
      - title: A private adventure
        tag: A complete story
        text: Ask about a self-contained adventure for a single gathering with friends.
        link: {label: Discuss a private adventure, url: consultation/}
      - title: An ongoing campaign
        tag: A possible next chapter
        text: Discuss whether a continuing story, recurring group, and regular schedule could fit.
        link: {label: Discuss a continuing story, url: consultation/}
      - title: A first game together
        tag: For guests new to tabletop play
        text: Ask how first-time players can try a simple opening choice and learn the rules as they go.
        link: {label: Discuss a first session, url: consultation/}
      - title: A celebration
        tag: An occasion worth sharing
        text: Explore how a birthday, reunion, or gathering could inform the adventure.
        link: {label: Discuss an occasion, url: consultation/}
      - title: A team gathering
        tag: Colleagues around a table
        text: Ask whether the group, venue, and purpose suit a shared roleplaying experience.
        link: {label: Discuss a team event, url: consultation/}
      - title: A remote table
        tag: A format to explore
        text: Ask about the feasibility of playing online, including platform and access needs.
        link: {label: Discuss remote play, url: consultation/}
