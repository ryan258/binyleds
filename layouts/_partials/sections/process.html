{{- $data := .data -}}
<section class="section-pad section--forest" aria-labelledby="{{ .id }}-title">
  <div class="shell">
    <div class="section-heading-row">
      <div>
        <p class="eyebrow">{{ $data.eyebrow }}</p>
        <h2 id="{{ .id }}-title">{{ $data.title }}</h2>
      </div>
      <p>{{ $data.intro }}</p>
    </div>
    <ol class="process-list">
      {{ range $data.steps }}
      <li>
        <span class="process-number">{{ .number }}</span>
        <h3>{{ .title }}</h3>
        <p>{{ .text }}</p>
      </li>
      {{ end }}
    </ol>
    <a class="text-link text-link--light" href="{{ "how-it-works/" | relURL }}">See how the evening works <span aria-hidden="true">&rarr;</span></a>
  </div>
</section>
