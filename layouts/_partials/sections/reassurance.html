{{- $data := .data -}}
<section class="section-pad section--parchment" aria-labelledby="{{ .id }}-title">
  <div class="shell editorial-grid">
    <div class="section-intro">
      <p class="eyebrow">{{ $data.eyebrow }}</p>
      <h2 id="{{ .id }}-title">{{ $data.title }}</h2>
    </div>
    <div class="section-copy">
      {{ range $data.paragraphs }}<p>{{ . }}</p>{{ end }}
      <blockquote>{{ $data.pullquote }}</blockquote>
      <a class="text-link" href="{{ "for-your-table/" | relURL }}">See who the experience is for <span aria-hidden="true">&rarr;</span></a>
    </div>
  </div>
</section>
