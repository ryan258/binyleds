<section class="section-pad collection-section" aria-labelledby="{{ .id }}-title">
  <div class="shell">
    {{ partial "sections/heading.html" . }}
    <div class="module-card-grid">
      {{ range .data.items }}
      <article class="module-card">
        {{ with .tag }}<p class="eyebrow">{{ . }}</p>{{ end }}
        <h3>{{ .title }}</h3>
        <p>{{ .text }}</p>
        {{ with .link }}<a class="text-link" href="{{ .url | relURL }}">{{ partial "consultation-link-label.html" . }} <span aria-hidden="true">&rarr;</span></a>{{ end }}
      </article>
      {{ end }}
    </div>
  </div>
</section>
