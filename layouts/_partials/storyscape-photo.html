<figure class="artwork-figure {{ .class }}">
  <img src="{{ .art.image | relURL }}"
    srcset="{{ .art.small | relURL }} 720w, {{ .art.image | relURL }} 1200w"
    sizes="(max-width: 800px) calc(100vw - 48px), 45vw"
    width="1200" height="800" alt="{{ .art.alt }}" decoding="async"
    {{- if .priority }} fetchpriority="high"{{ end }}>
</figure>
