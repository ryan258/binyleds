{{- $built := not hugo.IsServer -}}
{{- $script := resources.Get "js/site.js" | js.Build (dict "targetPath" "assets/js/storyscape.js" "minify" $built) -}}
{{- if $built -}}
  {{- $script = $script | fingerprint -}}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{- else -}}
  <script src="{{ $script.RelPermalink }}" defer></script>
{{- end }}
