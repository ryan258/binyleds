name: Build and validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Pages deployments are serialised, but never cancelled mid-flight: cancelling
# a half-finished deploy can leave the published site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install Node for intake boundary tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build, audit, and verify inquiry and hosting modes
        run: |
          bash scripts/with-dart-sass.sh bash -e -c '
            bash scripts/check.sh
            npm run test:intake
            npm run test:hosting
          '

  # Static staging mirror: no inquiry backend, noindex, no sitemap.
  # Configured host behavior is not evidence of an actual production deployment.
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build staging site
        run: |
          bash scripts/with-dart-sass.sh hugo --gc --minify --panicOnWarning --cleanDestinationDir \
            --environment staging \
            --disableKinds sitemap \
            --baseURL "https://ryan258.github.io/binyleds/"

      # Reuse the root/subpath-aware audit for the deployed project prefix.
      - name: Verify the staging build
        run: |
          python3 scripts/audit_site.py public --expect-noindex --base-url "https://ryan258.github.io/binyleds/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
